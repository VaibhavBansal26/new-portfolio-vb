<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ShopFlow realtime commerce operations</title>
  <desc id="desc">An editorial ecommerce operations dashboard showing live orders, fulfillment, recommendations and delivery tracking.</desc>
  <defs>
    <linearGradient id="sf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a18"/>
      <stop offset="1" stop-color="#11382f"/>
    </linearGradient>
    <linearGradient id="sf-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58e29d"/>
      <stop offset="1" stop-color="#b5ef6a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sf-bg)"/>
  <g opacity=".14" fill="none" stroke="#75ddb3" stroke-width="2">
    <circle cx="1320" cy="120" r="280"/><circle cx="1320" cy="120" r="195"/><circle cx="260" cy="805" r="270"/>
  </g>
  <text x="230" y="104" fill="#9ac5b6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" letter-spacing="5">REALTIME COMMERCE / OPERATIONS</text>
  <text x="228" y="202" fill="#f4fff9" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="750" letter-spacing="-3">ShopFlow</text>
  <text x="232" y="253" fill="#a3c4b7" font-family="Inter, Arial, sans-serif" font-size="27">Shopper, admin, rider and AI ordering — coordinated as one live system.</text>

  <g transform="translate(225 330)">
    <rect width="1150" height="370" rx="18" fill="#0c2420" stroke="#2f6657" stroke-width="2"/>
    <rect width="220" height="370" rx="18" fill="#081a18"/>
    <text x="30" y="48" fill="#79a698" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2">SHOPFLOW OS</text>
    <g font-family="Inter, Arial, sans-serif" font-size="20" fill="#c9e4da">
      <rect x="20" y="76" width="180" height="48" rx="9" fill="#17443a"/><text x="44" y="107">Live orders</text>
      <text x="44" y="162">Products</text><text x="44" y="212">Riders</text><text x="44" y="262">Subscriptions</text><text x="44" y="312">AI assistant</text>
    </g>
    <g transform="translate(254 32)">
      <text x="0" y="28" fill="#f0fff9" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="700">Order operations</text>
      <text x="0" y="58" fill="#739e91" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">WEBSOCKET LIVE FEED · REDIS COORDINATION</text>
      <g transform="translate(0 88)" font-family="Inter, Arial, sans-serif">
        <g><rect width="252" height="94" rx="13" fill="#12322c"/><text x="22" y="34" fill="#83af9f" font-size="16">ORDERS TODAY</text><text x="22" y="75" fill="#f4fff9" font-size="38" font-weight="750">5,284</text></g>
        <g transform="translate(276)"><rect width="252" height="94" rx="13" fill="#12322c"/><text x="22" y="34" fill="#83af9f" font-size="16">ON THE WAY</text><text x="22" y="75" fill="#f4fff9" font-size="38" font-weight="750">184</text></g>
        <g transform="translate(552)"><rect width="252" height="94" rx="13" fill="url(#sf-accent)"/><text x="22" y="34" fill="#164133" font-size="16">RECOMMENDED</text><text x="22" y="75" fill="#09231c" font-size="38" font-weight="750">92%</text></g>
      </g>
      <g transform="translate(0 208)" font-family="Inter, Arial, sans-serif" font-size="18">
        <rect width="804" height="92" rx="12" fill="#0f2c27" stroke="#315f54"/>
        <circle cx="38" cy="46" r="15" fill="#58e29d"/><text x="68" y="38" fill="#e7fbf3" font-weight="700">#SF-2048 · Grocery subscription</text><text x="68" y="66" fill="#83a99b">Packed → rider assigned → live ETA 18 min</text>
        <rect x="650" y="27" width="120" height="38" rx="19" fill="#173f36"/><text x="710" y="52" text-anchor="middle" fill="#85e8bc" font-size="15" font-weight="700">TRACKING</text>
      </g>
    </g>
  </g>
  <g transform="translate(230 790)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#91b9aa">
    <text>REACT + NODE</text><text x="300">POSTGRES + REDIS</text><text x="650">LIVE DELIVERY</text><text x="940">HYBRID RECOMMENDATIONS</text>
  </g>
</svg>
