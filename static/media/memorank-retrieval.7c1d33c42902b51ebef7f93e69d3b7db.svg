<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MemoRank agent-memory retrieval console</title>
  <desc id="desc">A dark security console showing hybrid memory retrieval, reranking, evidence records and measured agent accuracy.</desc>
  <defs>
    <linearGradient id="memo-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090d18"/><stop offset="1" stop-color="#171f36"/></linearGradient>
    <linearGradient id="memo-accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8f91ff"/><stop offset="1" stop-color="#53d5ad"/></linearGradient>
    <pattern id="memo-grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#aeb4ff" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#memo-bg)"/><rect width="1600" height="900" fill="url(#memo-grid)"/>
  <text x="92" y="96" fill="#929bd0" font-family="monospace" font-size="22" letter-spacing="6">/ LONG-HORIZON AGENT MEMORY</text>
  <text x="90" y="178" fill="#f7f4ea" font-family="Arial,sans-serif" font-size="72" font-weight="750">MemoRank</text>
  <text x="92" y="224" fill="#9da7be" font-family="Arial,sans-serif" font-size="26">The right memory, before the next decision.</text>
  <rect x="90" y="280" width="1420" height="504" rx="12" fill="#0e1425" stroke="#303a59" stroke-width="2"/>
  <g transform="translate(128 324)">
    <text fill="#7782a7" font-family="monospace" font-size="16" letter-spacing="3">RECALL QUERY</text>
    <rect y="32" width="640" height="68" rx="8" fill="#171f36" stroke="#3b4669"/>
    <text x="24" y="75" fill="#e5e8f1" font-family="monospace" font-size="20">What changed on host web-12?</text>
    <g transform="translate(0 138)" font-family="monospace">
      <rect width="640" height="78" rx="7" fill="#19243d" stroke="#6370d4"/>
      <text x="22" y="31" fill="#8f91ff" font-size="14" letter-spacing="2">RANK 01 · 0.96 · ENTITY MATCH</text>
      <text x="22" y="58" fill="#f7f4ea" font-size="18">web-12 role set to production server</text>
      <rect y="92" width="640" height="78" rx="7" fill="#151d31" stroke="#303a59"/>
      <text x="22" y="123" fill="#7fd9bb" font-size="14" letter-spacing="2">RANK 02 · 0.91 · TEMPORAL LINK</text>
      <text x="22" y="150" fill="#dfe3ee" font-size="18">ticket INC-482 approved the change</text>
      <rect y="184" width="640" height="78" rx="7" fill="#151d31" stroke="#303a59"/>
      <text x="22" y="215" fill="#8893b4" font-size="14" letter-spacing="2">RANK 03 · 0.82 · BM25 + DENSE</text>
      <text x="22" y="242" fill="#c9cfde" font-size="18">backup transfer completed at 02:14</text>
    </g>
  </g>
  <g transform="translate(828 324)" font-family="monospace">
    <text fill="#7782a7" font-size="16" letter-spacing="3">EVALUATED PIPELINE</text>
    <rect y="32" width="642" height="138" rx="8" fill="#181f36" stroke="#3b4669"/>
    <text x="28" y="67" fill="#aab2cb" font-size="15">OPENAI AGENT ACCURACY</text>
    <text x="28" y="122" fill="#f7f4ea" font-family="Arial,sans-serif" font-size="48" font-weight="700">0.621</text>
    <path d="M190 104H328" stroke="url(#memo-accent)" stroke-width="7"/><path d="m328 104-20-12v24z" fill="#53d5ad"/>
    <text x="360" y="122" fill="#53d5ad" font-family="Arial,sans-serif" font-size="48" font-weight="700">0.797</text>
    <text x="28" y="154" fill="#7fd9bb" font-size="14">340 PRE-REGISTERED SESSIONS · p = 0.0003</text>
    <rect y="190" width="306" height="126" rx="8" fill="#131a2c" stroke="#303a59"/>
    <text x="24" y="226" fill="#7782a7" font-size="14" letter-spacing="2">RETRIEVAL</text><text x="24" y="270" fill="#f7f4ea" font-family="Arial,sans-serif" font-size="30" font-weight="700">BM25 + DENSE</text><text x="24" y="297" fill="#8f91ff" font-size="15">CROSS-ENCODER</text>
    <rect x="326" y="190" width="316" height="126" rx="8" fill="#13251f" stroke="#2e6655"/>
    <text x="350" y="226" fill="#6fb99e" font-size="14" letter-spacing="2">SERVING</text><text x="350" y="270" fill="#f7f4ea" font-family="Arial,sans-serif" font-size="30" font-weight="700">MCP TOOLS</text><text x="350" y="297" fill="#53d5ad" font-size="15">OPENAI + ANTHROPIC</text>
    <rect y="336" width="642" height="78" rx="8" fill="#11182a" stroke="#303a59"/><text x="24" y="367" fill="#7782a7" font-size="14">CI RECALL GATE</text><rect x="180" y="354" width="420" height="14" rx="7" fill="#283149"/><rect x="180" y="354" width="392" height="14" rx="7" fill="url(#memo-accent)"/><text x="24" y="400" fill="#f7f4ea" font-size="18">0.967 RECALL@10</text>
  </g>
  <rect x="90" y="824" width="1420" height="4" fill="url(#memo-accent)"/>
  <text x="92" y="866" fill="#7f89a8" font-family="monospace" font-size="17" letter-spacing="3">MEMORY · RERANK · ENTITY CHAIN · EVALUATE · SHIP</text>
</svg>
